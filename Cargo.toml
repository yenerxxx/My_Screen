[package]
name = "my_screen_professional"
version = "7.2.2"
edition = "2021"
description = "MY Screen 7.1 Professional - Native Rust Windows Screenshot & Annotation Tool (Liquid Glass Edition)"

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", features = ["png", "jpeg", "ico", "bmp", "webp"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rfd = "0.15"
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
image = { version = "0.25", features = ["png", "ico"] }
tiny-skia = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
